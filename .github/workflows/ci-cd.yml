name: Build and Push Docker Images

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}   # автоматически подставит marat1905 или владельца репозитория
  API_IMAGE: assettracker-api
  WEB_IMAGE: assettracker-web

jobs:
  # Запуск тестов для .NET (всегда, но можно ограничить)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore AssetTracker.sln

      - name: Build solution
        run: dotnet build AssetTracker.sln --no-restore -c Release

      - name: Run tests
        run: dotnet test AssetTracker.sln --no-build -c Release --verbosity normal

  # Сборка и публикация Docker‑образов (только на push в master/develop)
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'   # не запускается на pull_request
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Поддержка кэширования слоёв Docker (исправляет ошибку с драйвером)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container   # необходим для cache-to

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Сборка и публикация API (.NET)
      - name: Build and push AssetTracker API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: AssetTracker.WebAPI/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.API_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Сборка и публикация Web (Vite+React) — раскомментируйте когда создадите Dockerfile
      # - name: Build and push AssetTracker Web
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: Web/testproj
      #     file: Web/testproj/Dockerfile
      #     push: true
      #     tags: |
      #       ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.WEB_IMAGE }}:latest
      #       ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.WEB_IMAGE }}:${{ github.sha }}
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max