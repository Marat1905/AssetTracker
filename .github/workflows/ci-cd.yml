name: Build and Push Docker Images

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  API_IMAGE: assettracker-api
  WEB_IMAGE: assettracker-web

jobs:
  test-api:
    runs-on: ubuntu-latest
    # Run on both PR and push, but skip if only documentation changed (optional)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore AssetTracker.sln
      - run: dotnet build AssetTracker.sln --no-restore -c Release
      - run: dotnet test AssetTracker.sln --no-build -c Release --verbosity normal

  build-and-push:
    runs-on: ubuntu-latest
    needs: test-api            # ✅ tests must pass before building
    # Only push images on push events (not on PRs)
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: AssetTracker.WebAPI/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.API_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Uncomment when frontend Dockerfile is ready
      # - name: Build and push Web
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: Web/testproj
      #     file: Web/testproj/Dockerfile
      #     push: true
      #     tags: |
      #       ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.WEB_IMAGE }}:latest
      #       ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.WEB_IMAGE }}:${{ github.sha }}