name: Build and Push Docker Images

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  REGISTRY: ghcr.io
  OWNER: marat1905  # GitHub username в нижнем регистре
  API_IMAGE: assettracker-api
  WEB_IMAGE: assettracker-web

jobs:
  # 🔹 Job 1: Тесты .NET (запускается всегда)
  test-api:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore AssetTracker.sln

      - name: Build solution
        run: dotnet build AssetTracker.sln --no-restore -c Release

      - name: Run tests
        run: dotnet test AssetTracker.sln --no-build -c Release --verbosity normal

  # 🔹 Job 2: Сборка и публикация Docker-образов
  build-and-push:
    runs-on: ubuntu-latest
    needs: test-api  # Запускается после успешных тестов (для PR)
    if: github.event_name == 'push'  # Только для push-событий
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🔸 1. Сборка Web API (ASP.NET Core)
      - name: Build and push AssetTracker API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: AssetTracker.WebAPI/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.API_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 🔸 2. Сборка Frontend (Vite+React) — требует Dockerfile
      # Раскомментируйте, если создадите Dockerfile для Web/testproj
      # - name: Build and push AssetTracker Web
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: Web/testproj
      #     file: Web/testproj/Dockerfile
      #     push: true
      #     tags: |
      #       ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.WEB_IMAGE }}:latest
      #       ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.WEB_IMAGE }}:${{ github.sha }}
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max